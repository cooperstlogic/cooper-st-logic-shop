version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Everything here is a devDependency; batch the routine bumps into one PR
      # and let majors (e.g. Eleventy 2 -> 3) arrive on their own for review.
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Groups above only cover version updates. Without this, every advisory
      # opens its own PR — the whole tree is build-time only, so batch them.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
