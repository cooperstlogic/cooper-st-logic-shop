<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Very subtle rough paper edge - minimal text distortion -->
    <filter id="roughEdge" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
