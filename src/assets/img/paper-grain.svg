<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle paper fiber texture -->
    <filter id="paperFiber" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04,0.12" numOctaves="3" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  
  <!-- Slightly more visible paper grain -->
  <rect width="100%" height="100%" filter="url(#paperFiber)" opacity="0.15"/>
</svg>
