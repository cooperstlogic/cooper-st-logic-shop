<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base Paper Texture (High Frequency) -->
    <filter id="paperGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0.7 0 0 0 0  0 0.7 0 0 0  0 0 0.7 0 0  0 0 0 0.5 0" in="noise" result="coloredNoise"/>
    </filter>
    
    <!-- Paper Creases / Uneven Surface (Low Frequency) -->
    <filter id="paperCrease">
      <feTurbulence type="turbulence" baseFrequency="0.01" numOctaves="5" seed="5" result="turbulence"/>
      <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="20" xChannelSelector="R" yChannelSelector="G"/>
      <feDiffuseLighting in="turbulence" lighting-color="#fff" surfaceScale="2">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
    </filter>
  </defs>
  
  <!-- 1. The Fiber Noise -->
  <rect width="100%" height="100%" filter="url(#paperGrain)" opacity="0.2"/>
  
  <!-- 2. Subtle Creasing/Shadows overlay -->
  <rect width="100%" height="100%" filter="url(#paperCrease)" opacity="0.1" style="mix-blend-mode: multiply"/>
</svg>
