<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Very fine, dense horizontal brushed grain -->
    <filter id="fineBrushedGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01,0.8" numOctaves="3" seed="42" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  
  <!-- Fine horizontal grain - very subtle -->
  <rect width="100%" height="100%" filter="url(#fineBrushedGrain)" opacity="0.25"/>
</svg>
