[build]
  command = "npm run build"
  publish = "_site"

# Applies to everything. The /assets/* blocks below override Cache-Control
# only; these security headers still apply there.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    # HTML must revalidate. Netlify serves ETags, so this costs a 304, not a
    # re-download. Never cache HTML "immutable": returning visitors get pinned
    # to a stale page for the full max-age and a redeploy cannot dislodge it.
    Cache-Control = "public, max-age=0, must-revalidate"

# Asset filenames carry no content hash (cover.webp), so a long immutable
# cache would serve old files after every edit. CSS/JS links add ?v=<hash>
# (the `versioned` filter), so edits to those land on a fresh URL anyway.
# Short max-age plus stale-while-revalidate keeps repeat views fast while
# updates land quickly.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Images change far less often than CSS, and a briefly stale image is harmless.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# The book has no loose sheets. The annex plates (talk recordings, a poster)
# were retired, not moved: no page carries them. Links once handed out to
# /annex/ land on Fabrication, which names the day job behind the shop.
# 301 is deliberate and browsers cache it indefinitely, so reviving an /annex/
# path later will not reach anyone who already followed one of these links.
[[redirects]]
  from = "/annex"
  to = "/fabrication/"
  status = 301

[[redirects]]
  from = "/annex/*"
  to = "/fabrication/"
  status = 301
