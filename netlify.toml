[build]
  command = "npm run build"
  publish = "_site"

# Applies to everything. The /assets/* blocks below override Cache-Control
# only; these security headers still apply there.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    # HTML must revalidate. Netlify serves ETags, so this costs a 304, not a
    # re-download. Never cache HTML "immutable": returning visitors get pinned
    # to a stale page for the full max-age and a redeploy cannot dislodge it.
    Cache-Control = "public, max-age=0, must-revalidate"

# Asset filenames carry no content hash (reset.css, cover.webp), so a long
# immutable cache would serve old files after every edit. Short max-age plus
# stale-while-revalidate keeps repeat views fast while updates land quickly.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Images change far less often than CSS, and a briefly stale image is harmless.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ---------------------------------------------------------------------------
# THE ANNEX
#
# Supplementary material — direct links handed out alongside a CV. The
# plates are bound in at page 5 (/annex/), so the book does link to them;
# the intent is that search engines do not. Page 5 and every plate carry a
# <meta name="robots"> to match (a `robots` front-matter key in base.njk,
# hard-coded in annex.njk), and this header is the other half — it covers
# the bare files too, where a <meta> tag has nowhere to live.
#
# X-Robots-Tag rather than a robots.txt Disallow, for two reasons:
#   1. robots.txt is public, so listing /annex/ there advertises the exact
#      paths it is meant to keep quiet. It is the first file anyone curious
#      opens.
#   2. Disallow blocks crawling, which means the crawler never fetches the
#      page and never sees a noindex. A disallowed URL that gets linked from
#      somewhere can still be indexed URL-only, off the strength of the link
#      alone. The header is what actually removes a page from an index.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/annex/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

# Documents are linked from annex plates and must carry the same instruction
# themselves — a PDF is indexed on its own merits, not its referrer's.
# They are versioned by filename and effectively immutable once sent out, so
# they cache far longer than the HTML that points at them.
[[headers]]
  for = "/assets/docs/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
